name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Download JUnit dependencies
      run: |
        mkdir -p test/lib
        curl -o test/lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        curl -o test/lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
    
    - name: Compile and run simple tests
      run: |
        # Compile the simple test that doesn't require Eclipse
        javac -cp "src:test/lib/junit-4.13.2.jar:test/lib/hamcrest-core-1.3.jar" test/io/nncdevel/domaeclipseconfig/handlers/ConfigHandlerSimpleTest.java
        # Run the test
        java -cp "src:test:test/lib/junit-4.13.2.jar:test/lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore io.nncdevel.domaeclipseconfig.handlers.ConfigHandlerSimpleTest

  static-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Download static analysis tools
      run: |
        mkdir -p tools
        # Download PMD
        curl -L -o tools/pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.0.0/pmd-dist-7.0.0-bin.zip
        unzip -q tools/pmd.zip -d tools
        # Download Checkstyle
        curl -o tools/checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.4/checkstyle-10.12.4-all.jar

    - name: Run Checkstyle
      run: |
        java -jar tools/checkstyle.jar -c .github/checkstyle-config.xml src/
      continue-on-error: true

    - name: Run PMD
      run: |
        tools/pmd-bin-7.0.0/bin/pmd check -d src/ -R .github/pmd-ruleset.xml -f text
      continue-on-error: true